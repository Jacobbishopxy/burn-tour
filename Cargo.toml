[workspace]
members = ["crates/*"]
default-members = ["crates/quant_core", "crates/quant_lab"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Keep Burn pinned in one place for all study crates.
burn = { version = "0.19.0", features = ["wgpu", "train"] }
